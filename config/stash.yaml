# Stash 智能分流配置
# 使用前：把订阅 URL 替换为你自己的 Stash/Clash YAML 节点订阅地址。

mode: rule
log-level: warning

dns:
  default-nameserver:
    - system
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29

proxy-providers:
  subscription:
    # 必须是返回顶层 proxies 字段的 Stash/Clash YAML 节点集合。
    url: https://example.com/your-stash-provider.yaml
    path: ./providers/subscription.yaml
    interval: 3600

proxy-groups:
  - name: '⚡ 自动选择'
    type: url-test
    use:
      - subscription
    # 每 5 分钟重新测速，自动选择最低延迟的健康节点。
    interval: 300
    lazy: false

rules:
  # 局域网与本机地址直连。
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # 国外 AI 与 Apple Intelligence 必须优先走代理。
  # 这些规则必须位于 GEOSITE,cn 和 GEOIP,CN 之前，避免被国内规则抢先命中。
  - GEOSITE,apple-intelligence,⚡ 自动选择
  - GEOSITE,category-ai-!cn,⚡ 自动选择
  - GEOSITE,google-gemini,⚡ 自动选择

  # 关键服务的显式兜底规则，降低上游 GEOSITE 分类变动带来的漏匹配风险。
  - DOMAIN-SUFFIX,openai.com,⚡ 自动选择
  - DOMAIN-SUFFIX,chatgpt.com,⚡ 自动选择
  - DOMAIN-SUFFIX,oaistatic.com,⚡ 自动选择
  - DOMAIN-SUFFIX,oaiusercontent.com,⚡ 自动选择
  - DOMAIN-SUFFIX,anthropic.com,⚡ 自动选择
  - DOMAIN-SUFFIX,claude.ai,⚡ 自动选择
  - DOMAIN-SUFFIX,gemini.google.com,⚡ 自动选择
  - DOMAIN-SUFFIX,deepmind.com,⚡ 自动选择
  - DOMAIN-SUFFIX,perplexity.ai,⚡ 自动选择
  - DOMAIN-SUFFIX,x.ai,⚡ 自动选择
  - DOMAIN-SUFFIX,grok.com,⚡ 自动选择
  - DOMAIN-SUFFIX,copilot.microsoft.com,⚡ 自动选择
  - DOMAIN-SUFFIX,copilot.cloud.microsoft,⚡ 自动选择
  - DOMAIN-SUFFIX,githubcopilot.com,⚡ 自动选择
  - DOMAIN-SUFFIX,apple-relay.apple.com,⚡ 自动选择
  - DOMAIN-SUFFIX,apple-relay.cloudflare.com,⚡ 自动选择
  - DOMAIN-SUFFIX,apple-relay.fastly-edge.com,⚡ 自动选择
  - DOMAIN-SUFFIX,apple-relay.mask.apple-dns.net,⚡ 自动选择
  - DOMAIN,gspe1-ssl.ls.apple.com,⚡ 自动选择

  # 苹果 AI 教程中的 Siri / iCloud Mask 兼容端点。
  # 使用精确域名，避免把 App Store 静态资源或整个 Apple 定位服务一并代理。
  - DOMAIN,guzzoni.apple.com,⚡ 自动选择
  - DOMAIN,mask-api.fe.apple-dns.net,⚡ 自动选择
  - DOMAIN,mask-api.icloud.com,⚡ 自动选择
  - DOMAIN,mask-t.apple-dns.net,⚡ 自动选择
  - DOMAIN,mask.apple-dns.net,⚡ 自动选择
  - DOMAIN,gateway.icloud.com,⚡ 自动选择
  - DOMAIN,mask-h2.icloud.com,⚡ 自动选择
  - DOMAIN,mask.icloud.com,⚡ 自动选择
  - DOMAIN-SUFFIX,cp4.cloudflare.com,⚡ 自动选择
  - DOMAIN-SUFFIX,smoot.apple.com,⚡ 自动选择

  # 微信与腾讯核心域名优先直连。
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,wx.qq.com,DIRECT
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,wechatapp.com,DIRECT
  - DOMAIN-SUFFIX,wechatpay.com,DIRECT
  - DOMAIN-SUFFIX,weixinbridge.com,DIRECT
  - DOMAIN-SUFFIX,tenpay.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,qpic.cn,DIRECT
  - DOMAIN-SUFFIX,qlogo.cn,DIRECT
  - DOMAIN-SUFFIX,gtimg.cn,DIRECT
  - DOMAIN-SUFFIX,gtimg.com,DIRECT
  - DOMAIN-SUFFIX,idqqimg.com,DIRECT
  - DOMAIN-SUFFIX,qqmail.com,DIRECT
  - DOMAIN-SUFFIX,tencent.com,DIRECT
  - DOMAIN-SUFFIX,tencent-cloud.net,DIRECT
  - DOMAIN-SUFFIX,myqcloud.com,DIRECT
  - DOMAIN-SUFFIX,qcloud.com,DIRECT
  - DOMAIN-SUFFIX,qcloudimg.com,DIRECT
  - DOMAIN-SUFFIX,url.cn,DIRECT

  # 腾讯生态与中国大陆常见网站/APP 域名直连。
  - GEOSITE,tencent,DIRECT
  - GEOSITE,cn,DIRECT

  # 中国大陆 IP 直连；其他流量由最低延迟节点代理。
  - GEOIP,CN,DIRECT
  - MATCH,⚡ 自动选择
